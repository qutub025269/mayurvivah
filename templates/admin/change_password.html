{% extends "admin/base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h1 class="page-title">Change Password</h1>
<form method="post" class="form-card narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label>
  <label>New password (min 8 characters)<input type="password" name="new_password" required autocomplete="new-password"></label>
  <label>Confirm new password<input type="password" name="confirm_password" required autocomplete="new-password"></label>
  <button type="submit" class="btn btn-primary btn-block">Change Password</button>
</form>
{% endblock %}
